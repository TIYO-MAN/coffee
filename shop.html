<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop</title>
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <h1>Our Coffee Shop</h1>

  <!-- Product List -->
  <div class="product">
    <h2>Ethiopian Arabica</h2>
    <p>Price: $12 per kg</p>
    <input type="number" id="arabicaQty" value="1" min="1">
    <button onclick="addToCart('Ethiopian Arabica', 12, 'arabicaQty')">Add to Cart</button>
  </div>

  <div class="product">
    <h2>House Blend</h2>
    <p>Price: $10 per kg</p>
    <input type="number" id="blendQty" value="1" min="1">
    <button onclick="addToCart('House Blend', 10, 'blendQty')">Add to Cart</button>
  </div>

  <!-- Delivery Input -->
  <div class="delivery">
    <label>Delivery Distance (km):</label>
    <input type="number" id="distance" value="0" min="0">
    <button onclick="calculateTotal()">Calculate Total</button>
  </div>

  <!-- Cart Display -->
  <h2>Your Cart</h2>
  <div id="cart"></div>
  <h3 id="total"></h3>

  <script src="shop.js"></script>
</body>
</html>
