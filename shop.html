<body>
  <header class="shop-header">
    <h1>Order Fresh Coffee</h1>
    <p>Choose your roast, size, and quantity</p>
  </header>

  <!-- Roast Selection -->
  <section class="roast-options">
    <h2>Select Roast Level</h2>
    <label><input type="radio" name="roast" value="Light"> Light – Sharp acidity</label><br>
    <label><input type="radio" name="roast" value="Medium"> Medium – Balanced & sweet</label><br>
    <label><input type="radio" name="roast" value="Dark"> Dark – Bold & smoky</label>
  </section>

  <!-- Size Selection -->
  <section class="size-options">
    <h2>Select Size</h2>
    <select id="size">
      <option value="250" data-price="740">250g – ETB 740</option>
      <option value="500" data-price="1400">500g – ETB 1,400</option>
      <option value="1000" data-price="2700">1000g – ETB 2,700</option>
    </select>
  </section>

  <!-- Quantity -->
  <section class="quantity">
    <h2>Quantity</h2>
    <button onclick="changeQty(-1)">−</button>
    <span id="qty">0</span>
    <button onclick="changeQty(1)">+</button>
  </section>

  <!-- Promo Code -->
  <section class="promo">
    <h2>Promo Code</h2>
    <input type="text" id="promo" placeholder="Enter code">
    <button onclick="applyPromo()">Apply</button>
  </section>

  <!-- Delivery -->
  <section class="delivery">
    <h2>Delivery Distance</h2>
    <input type="number" id="distance" value="0" min="0"> km
  </section>

  <!-- Cart -->
  <section class="cart">
    <h2>Cart</h2>
    <button onclick="addToCart()">Add to Cart 🛒</button>
    <div id="cart"></div>
    <h3 id="total"></h3>
  </section>

  <footer>
    <div style="margin-top:20px; font-size:14px; color:#aaa;">
  <p>  © 2026 Nione Coffee. All rights reserved.</p>
  </div>
</footer>
